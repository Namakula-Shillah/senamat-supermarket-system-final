<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SENAMAT SUPERMARKET | Sign Up</title>
  {% load static crispy_forms_tags %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <link rel="stylesheet" href="{% static 'dashboard.css' %}?v=12">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="login-logo">SSFM</div>
      <h1>Create an account</h1>
      <p class="sub">Register to access SENAMAT SUPERMARKET.</p>
      <form method="post" action="{% url 'signup' %}">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form|crispy }}
        <button type="submit">Sign Up</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </section>
  </main>
</body>
</html>

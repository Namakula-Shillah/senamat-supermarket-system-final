<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENAMAT SUPERMARKET | Login</title>
{% load static crispy_forms_tags %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'style.css' %}">
<link rel="stylesheet" href="{% static 'dashboard.css' %}?v=12">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="login-logo" src="{% static 'assets/dashboard/images/logo1.png' %}" alt="SENAMAT SUPERMARKET logo">
      <h1>SENAMAT SUPERMARKET</h1>
      <p class="sub">Supermarket Management System</p>
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        {{ form|crispy }}
        <button type="submit">Log In</button>
      </form>
      {% if form.errors %}<p role="alert">Login failed. Check your username and password.</p>{% endif %}
      <p class="auth-switch">New here? <a href="{% url 'signup' %}">Create an account</a></p>
    </div>
  </div>

</body>
</html>
